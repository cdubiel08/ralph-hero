# CodeRabbit configuration (GH-1589) — the external independent reviewer in
# the portable merge gate. Repo is public → full Pro features free.
#
# Roles in the gate:
#   - Its review satisfies scripts/merge-pr.sh gate 5 + the validator's
#     external-review check (policy: .github/ralph-merge-policy.json).
#   - request_changes_workflow: unresolved findings surface as a
#     CHANGES_REQUESTED reviewDecision, which gate 1 hard-blocks (not
#     forceable) until resolved or dismissed.
#
# thoughts/ and .claude/ are session/knowledge artifacts, not product code —
# excluded to keep reviews focused and quiet.

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Incremental reviews consume the SAME per-developer rate limit as full
    # ones, and an agent building a change pushes several times — PR #1681
    # burned 5 reviews across 2 SHAs for one change, and #1688 had a push
    # silently dropped mid-window. Only the FINAL head is decision-relevant:
    # attestation is head_sha-bound and so is merge-pr.sh gate 5. So review
    # on open/ready only; push-then-review is an explicit
    # "@coderabbitai review". Way of working this expects: open the PR as a
    # DRAFT while building (drafts aren't reviewed), mark it ready when
    # final → exactly one review, at the SHA that gets merged.
    #
    # CONSEQUENCE, by design: after you address review findings, pushing the
    # fix does NOT re-review. request_changes_workflow below means an
    # unresolved review sets reviewDecision=CHANGES_REQUESTED, which
    # merge-pr.sh gate 1 blocks and no --force can clear — and a push does not
    # reliably dismiss it. So the fix loop is: push the fix, then comment
    # "@coderabbitai review" to get a fresh verdict at the new head.
    auto_incremental_review: false
  path_filters:
    - "!thoughts/**"
    - "!.claude/**"

chat:
  auto_reply: true
