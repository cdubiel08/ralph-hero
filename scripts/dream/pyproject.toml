[project]
name = "ralph-dream"
version = "0.1.0"
description = "Ralph-knowledge dream-loop: ingest 24h of raw memories from gemma-lab sessions, git commits, and optional llm-cli logs; cluster + synthesize reflections nightly."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "hdbscan>=0.8.38",
    "umap-learn>=0.5.6",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["ingest.py", "reflect.py", "meta_reflect.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
