# ralph-playwright journey trace schema
# Output of the execute primitive, input to the reflect primitive
# Same format regardless of structured or freeform execution
#
# Optional per-step `capture` object records the resolution and mode used
# when a step opted into --high-res (GH-794). Absence means default viewport
# capture; existing journey-traces without `capture` remain valid.

type: object
required: [id, timestamp, input, session, runtime, steps, summary]
properties:
  id:
    type: string
    format: uuid
    description: "Unique trace identifier"
  timestamp:
    type: string
    format: date-time
    description: "ISO-8601 execution timestamp"
  input:
    type: object
    description: "Echo of the execute input for reproducibility. When the caller passes a `mode` field (`ref` or `vision-first`), it MUST be echoed here (e.g., `input.mode: vision-first`). Remains a free-form object — no nested `properties` block — so callers can extend the input shape without a schema bump."
  session:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Session name matching the .playwright-cli/ subdirectory"
  runtime:
    type: object
    required: [backend, version]
    properties:
      backend:
        type: string
        enum: [cli]
      version:
        type: string
        description: "playwright-cli version"
  steps:
    type: array
    minItems: 1
    items:
      type: object
      required: [index, action, target, outcome, screenshot, snapshot, console, duration_ms]
      properties:
        index:
          type: integer
          minimum: 0
        action:
          type: string
          description: "Action performed (navigate, click, fill, type, verify, etc.)"
        target:
          type: string
          description: "Target URL, element description, or verification condition"
        outcome:
          type: string
          enum: [pass, fail, skip]
        screenshot:
          type: string
          description: "Path to screenshot PNG relative to repo root"
        snapshot:
          type: string
          description: "Path to accessibility snapshot MD relative to repo root"
        console:
          type: array
          items:
            type: string
          description: "Console errors/warnings captured during this step"
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: ["string", "null"]
          description: "Error message if outcome is fail, null otherwise"
        decision_mode:
          type: string
          enum: [ref, vision-first]
          description: "Decision mode that produced this step. Defaults to `ref` when omitted for backward compatibility. Optional at the schema level; existing traces without the field remain valid."
        vision_rationale:
          type: ["string", "null"]
          description: "Short free-text describing what the agent saw and why it picked the target (e.g., 'primary blue CTA, top-right, only enabled button on page'). Expected to be non-null when `decision_mode: vision-first`, null otherwise. Not enforced at the schema level to keep the validator simple."
        # --- Vision-fallback telemetry (Phase 5 / GH-801, additive, backward-compatible) ---
        # `targeting_method` defaults to `a11y_ref` when absent (pre-existing traces pass unchanged).
        # `vision_fallback` is populated ONLY when `targeting_method == vision_fallback`.
        # Neither field appears in the step `required` list above — both are optional.
        targeting_method:
          type: string
          enum: [a11y_ref, vision_fallback]
          description: "Which targeting method resolved this step's target. Default a11y_ref when absent."
        vision_fallback:
          type: object
          description: "Populated only when targeting_method == vision_fallback. Captures the Opus 4.7 vision-locator response + dispatch outcome."
          properties:
            target_description:
              type: string
              description: "Plain-language target description passed to the locator prompt."
            resolved_x:
              type: ["integer", "null"]
              description: "Pixel x-coordinate returned by the locator (device pixels, pre-DPR-reconciliation). Null if target not found."
            resolved_y:
              type: ["integer", "null"]
              description: "Pixel y-coordinate returned by the locator (device pixels, pre-DPR-reconciliation). Null if target not found."
            confidence:
              type: number
              minimum: 0.0
              maximum: 1.0
              description: "Locator-reported confidence in the coordinate (0..1). Clamped to range."
            rationale:
              type: string
              description: "Locator-reported explanation of what it saw and why it chose the target."
            trigger_reason:
              type: string
              enum: [no_matching_ref, canvas_region, map_region, empty_snapshot]
              description: "Which trigger fired to escalate from a11y to vision."
            click_outcome:
              type: string
              enum: [pass, fail, out_of_bounds]
              description: "Dispatch-level outcome: pass = eval click succeeded; fail = locator returned None or eval errored; out_of_bounds = pre-dispatch bounds check rejected coords."
        # --- Semantic visual diff baseline reference (GH-809, additive, backward-compatible) ---
        # `baseline_ref` is populated by the reflect-phase wiring (GH-816) when a
        # baseline is available for this step. The matcher in
        # plugin/ralph-playwright/scripts/match-steps.mjs (GH-809) consumes the
        # baseline trace to find the corresponding step; the diff emitter (GH-813)
        # then loads the PNG via baseline-store.mjs#readBaseline().
        baseline_ref:
          type: string
          description: "Optional. Relative path under `thoughts/local/baselines/<session-slug>/` to the baseline screenshot used for semantic-diff comparison (GH-791). When absent, no baseline is available for this step and the diff emitter skips it. When present, `plugin/ralph-playwright/scripts/baseline-store.mjs#readBaseline()` must be able to resolve the path; otherwise the emitter fails loudly (see GH-816)."
        capture:
          type: object
          description: "Optional capture metadata. Present when step opted into --high-res or otherwise used a non-default resolution. Absence means default viewport capture. Added in GH-794."
          required: [resolution, device_scale_factor, mode]
          properties:
            resolution:
              type: string
              pattern: "^\\d+x\\d+$"
              description: "Actual pixel dimensions of the PNG, WxH (e.g., '2560x1440')"
            device_scale_factor:
              type: number
              minimum: 1
              description: "deviceScaleFactor (DPR) used at capture time. 1 = default, 2 = high-res preset."
            mode:
              type: string
              enum: [default, high-res]
              description: "Caller-declared intent. 'high-res' means the caller explicitly opted in via --high-res or equivalent; 'default' means a non-default resolution was used but via a different mechanism (e.g., ux-audit multi-viewport)."
  summary:
    type: object
    required: [total_steps, passed, failed, duration_ms]
    properties:
      total_steps:
        type: integer
        minimum: 1
      passed:
        type: integer
        minimum: 0
      failed:
        type: integer
        minimum: 0
      duration_ms:
        type: integer
        minimum: 0
