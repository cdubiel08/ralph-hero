# ralph-playwright signal report schema
# Output of the reflect primitive, input to the act primitive

type: object
required: [trace_id, timestamp, signals, summary]
properties:
  trace_id:
    type: string
    format: uuid
    description: "ID of the journey trace this report analyzes"
  timestamp:
    type: string
    format: date-time
    description: "ISO-8601 analysis timestamp"
  signals:
    type: array
    items:
      type: object
      required: [type, severity, title, description, evidence, tags]
      properties:
        type:
          type: string
          enum: [anomaly, regression, a11y_violation, ux_issue, error, data_interpretation]
        severity:
          type: string
          enum: [critical, high, medium, low]
        title:
          type: string
          description: "Short signal title"
        description:
          type: string
          description: "Detailed explanation of the signal"
        evidence:
          type: object
          required: [steps, screenshots]
          properties:
            steps:
              type: array
              items:
                type: integer
              description: "Step indices from the journey trace"
            screenshots:
              type: array
              items:
                type: string
              description: "Screenshot filenames as evidence"
            bboxes:
              type: array
              description: "Bounding boxes highlighting regions of interest in evidence screenshots"
              items:
                type: object
                required: [screenshot, x, y, w, h]
                properties:
                  screenshot:
                    type: string
                    description: "Screenshot filename (must also appear in evidence.screenshots)"
                  x:
                    type: integer
                    minimum: 0
                    description: "Top-left X pixel coordinate"
                  y:
                    type: integer
                    minimum: 0
                    description: "Top-left Y pixel coordinate"
                  w:
                    type: integer
                    minimum: 1
                    description: "Width in pixels"
                  h:
                    type: integer
                    minimum: 1
                    description: "Height in pixels"
                  note:
                    type: string
                    description: "Short label for what the box highlights"
        tags:
          type: array
          items:
            type: string
  summary:
    type: object
    required: [total_signals, by_severity, recommendation]
    properties:
      total_signals:
        type: integer
        minimum: 0
      by_severity:
        type: object
        required: [critical, high, medium, low]
        properties:
          critical:
            type: integer
            minimum: 0
          high:
            type: integer
            minimum: 0
          medium:
            type: integer
            minimum: 0
          low:
            type: integer
            minimum: 0
      recommendation:
        type: string
        description: "Actionable recommendation based on signals"
  # --- Reflect-phase model attribution (GH-787, additive, backward-compatible) ---
  # Per-step record of which model ran each reflect step and why. Populated by
  # the reflecting model when the step-importance escalation ladder was applied
  # (see skills/reflect/SKILL.md § Step-Importance Escalation). Absence is valid
  # — pre-existing signal-reports (pre-GH-787) pass unchanged.
  # Issue: https://github.com/cdubiel08/ralph-hero/issues/787
  # Shape mirrors the GH-794 `capture` sub-object idiom (optional outer object
  # with required fields inside each entry).
  reflect_meta:
    type: object
    description: "Per-step model attribution recorded by the reflect phase when the step-importance escalation ladder was applied. Optional; absence means the recording was not emitted (e.g., env-override set on a pre-GH-787 writer, or a single-step trace where no ladder decision was made)."
    properties:
      default_model:
        type: string
        description: "Model used for happy-path steps (typically claude-sonnet-4-6)."
      escalated_model:
        type: string
        description: "Model used when an escalation trigger fired (typically claude-opus-4-7)."
      by_step:
        type: object
        description: "Map from step index (stringified integer) to the model+reason that ran that step. Keys SHOULD be present for every step in the source journey-trace."
        additionalProperties:
          type: object
          required: [model, reason]
          properties:
            model:
              type: string
              description: "Full model ID that ran this step (e.g., claude-sonnet-4-6, claude-opus-4-7)."
            reason:
              type: string
              enum: [default, fail_escalation, prior_signal_escalation, env_override]
              description: "Why this model was chosen. default = baseline (no trigger fired); fail_escalation = step outcome==fail; prior_signal_escalation = step N-1 raised a signal; env_override = RALPH_PLAYWRIGHT_REFLECT_MODEL set."
