<!DOCTYPE html>
<!--
  v2.html — Modified variant for the semantic-diff smoke test.
  Differences from v1.html (intentional, to drive at least one regression signal):
    - Primary CTA `margin-top` increased from 16px to 56px (button shifts visibly down).
    - Primary CTA `box-shadow` removed (drop-shadow disappears).
    - A new banner appears above the header (added DOM element).
  See README.md in this directory for the expected diff outcome.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Semantic-Diff Smoke — v2 (changed)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --primary: #2563eb;
        --text: #111827;
        --bg: #ffffff;
        --muted: #6b7280;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
      }
      .promo-banner {
        background: #fef3c7;
        color: #92400e;
        padding: 12px 16px;
        text-align: center;
        font-weight: 600;
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 32px;
      }
      header {
        margin-bottom: 48px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 32px;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.5;
        color: var(--muted);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input[type="email"] {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }
      .cta {
        /* Intentional regression: pushed down and drop-shadow removed. */
        margin-top: 56px;
        align-self: flex-start;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        background: var(--primary);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: none;
      }
      footer {
        margin-top: 64px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="promo-banner">Limited offer — get 30% off your first year!</div>
    <div class="page">
      <header>
        <h1>Subscribe to the newsletter</h1>
        <p>
          Get a weekly digest of new posts. No spam, ever. Unsubscribe with one
          click.
        </p>
      </header>
      <form>
        <div>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" />
        </div>
        <button type="submit" class="cta">Subscribe</button>
      </form>
      <footer>v2 changed fixture for ralph-playwright semantic-diff smoke test.</footer>
    </div>
  </body>
</html>
