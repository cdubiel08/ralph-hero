[project]
name = "ralph-cos-desk"
version = "0.1.0"
description = "Ralph COS desk mode — Streamlit dashboard at :8502 (six panels + zero-Claude-Code chat panel)."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]
