[project]
name = "monitoring-bridge"
version = "0.1.0"
description = "Cloud Monitoring → GitHub Projects board bridge (Pub/Sub subscriber)"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-pubsub>=2.21.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
