name: Release

# === Design note: MCP-publish-only ===
#
# plugin/ralph-hero/ was deleted in GH-1438 (epic #1430, Phase 8).
# This workflow now handles ONLY the MCP server distribution channel:
#   - Triggers on mcp-server/ source changes
#   - Bumps mcp-server/package.json + publishes to npm (with provenance)
#   - Pins ralph/.mcp.json to the new version
#
# The ralph plugin versioning (ralph/.claude-plugin/plugin.json) is
# managed separately by release-ralph.yml.
#
# === Design note: publish-first ordering (hardening) ===
#
# `npm publish` runs BEFORE the commit/tag/push.
# If publish fails the workflow exits with nothing on main, so `.mcp.json`
# can never reference a version that doesn't exist on npm.
# =========================================================

on:
  push:
    branches: [main]
    paths:
      # MCP server source (top-level mcp-server/ — relocated in GH-1436)
      - 'mcp-server/src/**'
      - 'mcp-server/package.json'
      - 'mcp-server/package-lock.json'
      - 'mcp-server/tsconfig.json'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

# Top-level default: read-only. The release job widens to contents: write +
# id-token: write at the job level (needed for tag/push and npm provenance).
permissions:
  contents: read

defaults:
  run:
    working-directory: mcp-server

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Node 24 ships with npm 11.x natively, which is required for OIDC
      # trusted publishing (npm CLI >= 11.5.1). Earlier attempts with Node 22
      # + in-place `npm install -g npm@latest` hit MODULE_NOT_FOUND on
      # promise-retry during the self-upgrade reify step.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Determine version bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$MANUAL_BUMP" >> "$GITHUB_OUTPUT"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            # `(^|[^[:alnum:]])#minor([^[:alnum:]]|$)`, NOT `\b#minor\b`.
            # `\b` matches only at a word/non-word transition, and a marker
            # written the documented way — whitespace then `#` — is non-word
            # followed by non-word, so no boundary exists there and the match
            # never fired. Every release silently took the patch branch,
            # including PR #1624 (seven tool removals, published as a patch).
            # Verified: "x #minor" does not match \b#minor\b; "abc#minor" does.
            if echo "$COMMIT_MSG" | grep -qiE '(^|[^[:alnum:]])#major([^[:alnum:]]|$)'; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif echo "$COMMIT_MSG" | grep -qiE '(^|[^[:alnum:]])#minor([^[:alnum:]]|$)'; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump version (working tree only)
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          NEW_VERSION=$(npm version "$BUMP_TYPE" --no-git-tag-version | tr -d 'v')
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # ── PUBLISH-FIRST GATE ────────────────────────────────────────────────
      # Publish before commit/tag so .mcp.json never references an unpublished
      # version.

      - name: Publish to npm
        # Uses OIDC trusted publishing (id-token: write at job level).
        # npm CLI >= 11.5.1 auto-detects OIDC; no NODE_AUTH_TOKEN needed.
        run: npm publish --provenance --access public

      - name: Verify version on npm registry
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        # Poll the registry until the just-published version is visible.
        # npm has eventual consistency between the publish endpoint and the
        # CDN that serves `npm view`; without this gate we could push a tag
        # + .mcp.json referencing a version that briefly 404s for consumers.
        # Fails loudly if the version never appears — that's the signal that
        # publish silently failed.
        run: |
          set -euo pipefail
          echo "Verifying ralph-hero-mcp-server@${NEW_VERSION}..."
          ATTEMPTS=10
          DELAY=3
          for i in $(seq 1 "$ATTEMPTS"); do
            if npm view "ralph-hero-mcp-server@${NEW_VERSION}" version --json >/dev/null 2>&1; then
              echo "✓ ralph-hero-mcp-server@${NEW_VERSION} verified on registry"
              exit 0
            fi
            echo "  not yet visible (attempt $i/$ATTEMPTS); waiting ${DELAY}s..."
            sleep "$DELAY"
          done
          echo "::error::ralph-hero-mcp-server@${NEW_VERSION} not visible on npm registry after $((ATTEMPTS * DELAY))s"
          exit 1

      # ── POST-PUBLISH STEPS ────────────────────────────────────────────────

      - name: Pin version in ralph/.mcp.json
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          sed -i "s/ralph-hero-mcp-server@[0-9][0-9.]*/ralph-hero-mcp-server@${NEW_VERSION}/g" \
            ralph/.mcp.json

      - name: Commit version bump and tag
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp-server/package.json
          git add mcp-server/package-lock.json
          git add ralph/.mcp.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git pull --rebase origin main
          # GH-1589: push via the release deploy key — the sole bypass actor
          # on the protected-main ruleset. GITHUB_TOKEN pushes are blocked by
          # the pull_request rule, and the github-actions app cannot be a
          # bypass actor on user-owned repos.
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$HOME/.ssh/release_key"
          chmod 600 "$HOME/.ssh/release_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/release_key -o IdentitiesOnly=yes" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" main --tags

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: gh release create "v${NEW_VERSION}" --generate-notes --latest
