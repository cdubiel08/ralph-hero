name: Release

# === Design note: intentional plugin / npm decoupling ===
#
# This workflow ALWAYS bumps the version (package.json + plugin.json) and tags
# on every triggering push to main, but ONLY publishes to npm when the MCP
# server source actually changed (see `Publish to npm` step's `if:` guard).
#
# Why: ralph-hero ships through TWO distribution channels.
#   - The plugin (skills, agents, hooks) ships via git tags / GitHub Releases.
#     Claude Code's plugin marketplace pulls plugin content by version tag, so
#     every meaningful merge needs a tag — even skill-only changes.
#   - The MCP server ships via npm. Consumers pin a version in `.mcp.json` and
#     run it via `npx`. Skill-only changes do NOT need a new npm publish
#     because the MCP server source is unchanged.
#
# Consequence: `mcp-server/package.json` may sit a patch or two AHEAD of the
# latest npm-registry version. That cosmetic drift is INTENTIONAL — not a bug
# to "fix." Every plugin-only release bumps `package.json` so the next MCP
# release lands on a fresh patch number, which keeps tags monotonic and
# avoids tag-collision hazards.
#
# History: GH-968 (PR #973) misread the cosmetic drift as a bug and decoupled
# the bump step from `mcp_changed`, intending to keep `package.json` in lock-
# step with npm. That caused tag collisions when `package.json` later tried to
# "catch up" past a plugin-only tag, and required manual recovery. The change
# was reverted here. See thoughts/shared/plans/2026-05-03-GH-0968-*.md (now
# tombstoned) for the full retrospective. If you're tempted to re-decouple
# the bump from publish, read that thread first.
# =========================================================

on:
  push:
    branches: [main]
    paths:
      # MCP server (existing)
      - 'plugin/ralph-hero/mcp-server/src/**'
      - 'plugin/ralph-hero/mcp-server/package.json'
      - 'plugin/ralph-hero/mcp-server/package-lock.json'
      - 'plugin/ralph-hero/mcp-server/tsconfig.json'
      - 'plugin/ralph-hero/.claude-plugin/plugin.json'
      - 'plugin/ralph-hero/.mcp.json'
      # Plugin content (new)
      - 'plugin/ralph-hero/agents/**'
      - 'plugin/ralph-hero/skills/**'
      - 'plugin/ralph-hero/hooks/**'
      - 'plugin/ralph-hero/scripts/**'
      - 'plugin/ralph-hero/templates/**'
      - 'plugin/ralph-hero/justfile'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

# Top-level default: read-only. The release job widens to contents: write +
# id-token: write at the job level (needed for tag/push and npm provenance).
permissions:
  contents: read

defaults:
  run:
    working-directory: plugin/ralph-hero/mcp-server

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # For workflow_dispatch or new branch push (before is all-zeros), default to mcp_changed=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || echo "$BEFORE" | grep -qE '^0+$'; then
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
            echo "Classification: mcp_changed=true (dispatch or new branch)"
            exit 0
          fi

          DIFF=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$DIFF"

          MCP_CHANGED=false
          echo "$DIFF" | grep -qE '^plugin/ralph-hero/mcp-server/(src/|package\.json|package-lock\.json|tsconfig\.json)' && MCP_CHANGED=true

          echo "mcp_changed=$MCP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Classification: mcp_changed=$MCP_CHANGED"

      # Node 24 ships with npm 11.x natively, which is required for OIDC
      # trusted publishing (npm CLI >= 11.5.1). Earlier attempts with Node 22
      # + in-place `npm install -g npm@latest` hit MODULE_NOT_FOUND on
      # promise-retry during the self-upgrade reify step.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: plugin/ralph-hero/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Determine version bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$MANUAL_BUMP" >> "$GITHUB_OUTPUT"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE '\b#major\b'; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif echo "$COMMIT_MSG" | grep -qiE '\b#minor\b'; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          NEW_VERSION=$(npm version "$BUMP_TYPE" --no-git-tag-version | tr -d 'v')
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          PLUGIN_JSON="../.claude-plugin/plugin.json"
          jq --arg v "$NEW_VERSION" '.version = $v' "$PLUGIN_JSON" > tmp.json && mv tmp.json "$PLUGIN_JSON"

      - name: Pin version in justfile and .mcp.json
        if: steps.classify.outputs.mcp_changed == 'true'
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          sed -i "s/ralph-hero-mcp-server@[0-9][0-9.]*/ralph-hero-mcp-server@${NEW_VERSION}/g" \
            plugin/ralph-hero/justfile \
            plugin/ralph-hero/.mcp.json
          sed -i "s/MCP_VERSION=\"[0-9][0-9.]*\"/MCP_VERSION=\"${NEW_VERSION}\"/g" \
            plugin/ralph-hero/scripts/cli-dispatch.sh

      - name: Commit version bump and tag
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          MCP_CHANGED: ${{ steps.classify.outputs.mcp_changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin/ralph-hero/mcp-server/package.json
          git add plugin/ralph-hero/mcp-server/package-lock.json
          git add plugin/ralph-hero/.claude-plugin/plugin.json
          if [ "$MCP_CHANGED" = "true" ]; then
            git add plugin/ralph-hero/justfile
            git add plugin/ralph-hero/.mcp.json
            git add plugin/ralph-hero/scripts/cli-dispatch.sh
          fi
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git pull --rebase origin main
          git push origin main --tags

      - name: Publish to npm
        # Uses OIDC trusted publishing (id-token: write at job level).
        # npm CLI >= 11.5.1 auto-detects OIDC; no NODE_AUTH_TOKEN needed.
        if: steps.classify.outputs.mcp_changed == 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: gh release create "v${NEW_VERSION}" --generate-notes --latest
