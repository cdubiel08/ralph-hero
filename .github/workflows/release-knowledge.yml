name: Release Knowledge

on:
  push:
    branches: [main]
    paths:
      # MCP server
      - 'plugin/ralph-knowledge/src/**'
      - 'plugin/ralph-knowledge/package.json'
      - 'plugin/ralph-knowledge/package-lock.json'
      - 'plugin/ralph-knowledge/tsconfig.json'
      - 'plugin/ralph-knowledge/.claude-plugin/plugin.json'
      - 'plugin/ralph-knowledge/.mcp.json'
      # Plugin content
      - 'plugin/ralph-knowledge/skills/**'
      - 'plugin/ralph-knowledge/agents/**'
      - 'plugin/ralph-knowledge/hooks/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      republish:
        description: 'Republish current version (skip bump/tag/push, just publish to npm)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-knowledge
  cancel-in-progress: false

# Top-level default: read-only. The release job widens to contents: write +
# id-token: write at the job level (needed for tag/push and npm provenance).
permissions:
  contents: read

defaults:
  run:
    working-directory: plugin/ralph-knowledge

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || echo "$BEFORE" | grep -qE '^0+$'; then
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
            echo "Classification: mcp_changed=true (dispatch or new branch)"
            exit 0
          fi

          DIFF=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$DIFF"

          MCP_CHANGED=false
          echo "$DIFF" | grep -qE '^plugin/ralph-knowledge/(src/|package\.json|package-lock\.json|tsconfig\.json)' && MCP_CHANGED=true

          echo "mcp_changed=$MCP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Classification: mcp_changed=$MCP_CHANGED"

      # Node 24 ships with npm 11.x natively, which is required for OIDC
      # trusted publishing (npm CLI >= 11.5.1). Earlier attempts with Node 22
      # + in-place `npm install -g npm@latest` hit MODULE_NOT_FOUND on
      # promise-retry during the self-upgrade reify step. Mirrors release.yml.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: plugin/ralph-knowledge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Determine version bump
        id: bump
        if: inputs.republish != true
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "type=$MANUAL_BUMP" >> "$GITHUB_OUTPUT"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE '\b#major\b'; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif echo "$COMMIT_MSG" | grep -qiE '\b#minor\b'; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump version
        id: version
        if: inputs.republish != true
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          NEW_VERSION=$(npm version "$BUMP_TYPE" --no-git-tag-version | tr -d 'v')
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          PLUGIN_JSON=".claude-plugin/plugin.json"
          jq --arg v "$NEW_VERSION" '.version = $v' "$PLUGIN_JSON" > tmp.json && mv tmp.json "$PLUGIN_JSON"

      - name: Pin version in .mcp.json
        if: inputs.republish != true && steps.classify.outputs.mcp_changed == 'true'
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          sed -i "s/ralph-hero-knowledge-index@[0-9][0-9.]*/ralph-hero-knowledge-index@${NEW_VERSION}/g" \
            plugin/ralph-knowledge/.mcp.json

      - name: Commit version bump and tag
        if: inputs.republish != true
        working-directory: .
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin/ralph-knowledge/package.json
          git add plugin/ralph-knowledge/package-lock.json
          git add plugin/ralph-knowledge/.claude-plugin/plugin.json
          git add plugin/ralph-knowledge/.mcp.json
          git commit -m "chore(release): knowledge-v${NEW_VERSION} [skip ci]"
          git tag "knowledge-v${NEW_VERSION}"
          git pull --rebase origin main
          git push origin main --tags

      - name: Publish to npm
        # Falls back to classic NPM_TOKEN auth because the OIDC trusted
        # publisher for `ralph-hero-knowledge-index` is not configured on
        # npmjs.com (S8 of GH-1035 migrated only ralph-hero-mcp-server).
        # When OIDC + provenance was attempted, npm signed the provenance
        # statement but rejected the publish with E404 "you do not have
        # permission to access it" — that's the npm error for a missing or
        # mismatched trusted publisher.
        # TODO(GH-1035 follow-up): once the trusted publisher is set up
        # for this package + workflow, drop NODE_AUTH_TOKEN and re-add
        # --provenance.
        # `republish=true` re-publishes the current package.json version to
        # recover from a stuck release where bump/tag/push landed on main but
        # the publish step failed (e.g., orphaned tags 0.1.34..0.1.37).
        if: steps.classify.outputs.mcp_changed == 'true' || inputs.republish == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        if: inputs.republish != true
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: gh release create "knowledge-v${NEW_VERSION}" --generate-notes
