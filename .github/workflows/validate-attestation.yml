# validate-attestation.yml (GH-1589)
#
# Publishes the `ralph-attestation` commit status on PR head SHAs — the
# server-side re-validation of the merge attestation that scripts/merge-pr.sh
# checks client-side. Once the main ruleset requires this context, no harness
# can merge unattested work regardless of which tools it runs.
#
# Triggers:
#   pull_request (opened/synchronize/reopened) — a fresh push invalidates any
#     prior attestation (head_sha binding), so the status recomputes: pending
#     "awaiting attestation" until a matching attestation lands.
#   issue_comment (created/edited) — attestation comments are posted by
#     scripts/attest-pr.sh; validate as soon as one appears. NOTE: GitHub runs
#     issue_comment workflows from the DEFAULT branch, so this half only works
#     once the workflow is on main (bootstrap gap documented in the plan).
#
# Validation logic lives in scripts/validate-attestation.sh (canonical, also
# locally runnable); this workflow is a thin caller + status publisher.
#
# Fork caveat: on fork PRs the token is read-only and the status post fails —
# acceptable; agent PRs push branches to origin.

name: validate-attestation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: validate-attestation-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    # issue_comment also fires on plain issues — gate to PR comments carrying
    # the attestation marker (expression context; body never reaches a shell).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'ralph-attestation:v1'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate attestation and publish commit status
        run: |
          set -euo pipefail
          # Validator emits "state|sha|description" — the status is posted on
          # the SHA the verdict was computed against, never a re-queried head,
          # so a racing push can't inherit a stale verdict.
          result=$(bash scripts/validate-attestation.sh "$PR_NUMBER") || result="failure|unknown|validator error (see run log)"
          state="${result%%|*}"
          rest="${result#*|}"
          head_sha="${rest%%|*}"
          desc="${rest#*|}"
          echo "PR #$PR_NUMBER @ $head_sha → $state: $desc"
          if [[ "$head_sha" == "unknown" || -z "$head_sha" ]]; then
            echo "no resolvable head SHA — skipping status post (PR unreadable)"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$head_sha" \
            -f state="$state" \
            -f context="ralph-attestation" \
            -f description="${desc:0:130}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          echo "commit status published: ralph-attestation=$state"
