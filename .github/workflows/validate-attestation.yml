# validate-attestation.yml (GH-1589, extended by GH-1694)
#
# Two independent verdicts, two commit statuses:
#   ralph-attestation    — the merge attestation (GH-1589)
#   ralph-apply-keywords — closing-keyword hygiene for apply-kind work
#                          (GH-1694): no closing keyword may bind an apply
#                          unit, and an infra-touching PR may not close a ship
#                          issue with no apply twin. Runs from the trusted
#                          DEFAULT branch (it holds statuses: write and the
#                          checker lives in the tree) and refuses to publish if
#                          the PR changed under it mid-run.
#
# Publishes the `ralph-attestation` commit status on PR head SHAs — the
# server-side re-validation of the merge attestation that scripts/merge-pr.sh
# checks client-side. Once the main ruleset requires this context, no harness
# can merge unattested work regardless of which tools it runs.
#
# Triggers:
#   pull_request_target (opened/synchronize/reopened) — a fresh push invalidates
#     any prior attestation (head_sha binding), so the status recomputes:
#     pending "awaiting attestation" until matching evidence lands. The target
#     form keeps this status-writing workflow definition on the trusted default
#     branch.
#   issue_comment (created/edited/deleted) — attestation comments, head-bound
#     review requests, and external-review clean-result comments all affect the
#     verdict. Deletion must recompute too, or removed evidence leaves a stale
#     green status. Recompute on every PR issue comment so policy markers can
#     change without duplicating them in this workflow. NOTE: GitHub runs
#     issue_comment workflows from the DEFAULT branch, so this half only works
#     once the workflow is on main (bootstrap gap documented in the plan).
#   pull_request_review (submitted/dismissed) — the external-review check below
#     is part of this verdict, so a review LANDING must recompute it. Without
#     this the status keeps a stale "awaiting external review" pending on
#     evidence that has since become valid, and the ruleset blocks the merge
#     until someone re-posts the attestation by hand — which an unattended
#     runner has no way to know it should do (observed on PR #1689).
#     `dismissed` matters too: a dismissed review stops counting.
#
# Validation logic lives in scripts/validate-attestation.sh (canonical, also
# locally runnable); this workflow is a thin caller + status publisher.
#
# Fork PRs are safe on the target lane because no fork or PR-head content is
# checked out or executed; the trusted workflow publishes only commit statuses.

name: validate-attestation

on:
  # zizmor: ignore[dangerous-triggers] Every job checks out only the repository
  # default branch; no code or action from the PR head or target base executes.
  pull_request_target:
    # `edited` is here for the apply-keywords job only (see its `if`): editing
    # a PR body is exactly how a closing keyword gets added AFTER CI went
    # green, so a status computed once at `opened` would be stale where it
    # matters most. The attestation job deliberately ignores `edited` — a body
    # edit cannot change whether the head SHA is attested, and recomputing it
    # would just add runs.
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, dismissed]

# Least privilege is declared PER JOB (zizmor excessive-permissions): with two
# jobs, a workflow-level grant hands each job the union of what both need.
permissions: {}

# cancel-in-progress must stay FALSE: the push-triggered run, the attestation
# comment posted ~1s later, and every other PR comment (even runs whose job
# then skips — concurrency cancels BEFORE the job-level `if` evaluates) share
# this group. With `true`, 50% of real validations were observed cancelled
# 1-10s in, leaving a cancelled `validate` check on the head that blocked
# merge-pr.sh until a manual re-run (GH-1662 session, 2026-07-31). Queuing is
# safe: the posted status is bound to the SHA the verdict was computed
# against, so a delayed run cannot publish a stale verdict to a newer head.
# If a queued real run ever gets superseded by a marker-less comment run
# during a burst, the fallback is a distinct group for marker-less comments.
concurrency:
  group: validate-attestation-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    # issue_comment also fires on plain issues — gate to PR comments. Every PR
    # comment is relevant because external clean-result markers are policy-
    # configured and must not be duplicated here (comment bodies never reach a
    # shell).
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'edited') ||
      github.event_name == 'pull_request_review' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PR issue comments and PR-level reactions share the Issues API.
      issues: read
      # Resolve PR metadata and reviews.
      pull-requests: read
      # Publish the head-bound ralph-attestation commit status.
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # GitHub has no reaction event. Give a clean-result comment up to one
      # minute to acquire the connector's separately-created thumbs-up.
      RALPH_EXTERNAL_REVIEW_RETRIES: 12
      RALPH_EXTERNAL_REVIEW_RETRY_DELAY_SECONDS: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Commit statuses survive PR retargeting, so even an unprotected PR
          # base is not trusted. Always execute the default-branch policy and
          # validator; new gate behavior takes effect only after it merges.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate attestation and publish commit status
        run: |
          set -euo pipefail
          # Validator emits "state|sha|description" — the status is posted on
          # the SHA the verdict was computed against, never a re-queried head,
          # so a racing push can't inherit a stale verdict.
          result=$(bash scripts/validate-attestation.sh "$PR_NUMBER") || result="failure|unknown|validator error (see run log)"
          state="${result%%|*}"
          rest="${result#*|}"
          head_sha="${rest%%|*}"
          desc="${rest#*|}"
          echo "PR #$PR_NUMBER @ $head_sha → $state: $desc"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid head SHA — skipping status post (PR unreadable)"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$head_sha" \
            -f state="$state" \
            -f context="ralph-attestation" \
            -f description="${desc:0:130}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          echo "commit status published: ralph-attestation=$state"

  apply-keywords:
    # Only the pull_request_target lane: the verdict is a function of the PR's
    # closing keywords and diff, neither of which a comment or review can change.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publish the head-bound ralph-apply-keywords commit status.
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The DEFAULT branch, not the PR target base or merge commit. This job holds
      # `statuses: write`, and the checker + policy both live in the tree.
      # A commit status survives PR retargeting, so an unprotected target base
      # cannot safely grade a head that might later be retargeted to main.
      #
      # The cost is a bootstrap gap: a PR that CHANGES apply-keywords.sh is
      # graded by the version already on the default branch. That is the
      # correct direction (the old gate is trusted), and merge-pr.sh runs the
      # PR's own copy client-side, so the new behaviour is still exercised
      # before it lands.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check apply-keyword hygiene and publish commit status
        run: |
          set -uo pipefail
          # Capture the PR version BEFORE running the checker. A body edit
          # during the run would otherwise let this publish a verdict computed
          # against the previous closing keywords — on the SAME head SHA, so
          # nothing downstream could tell it was stale.
          before=$(gh pr view "$PR_NUMBER" --json headRefOid,updatedAt --jq '"\(.headRefOid)|\(.updatedAt)"')

          # The checker is the SAME script scripts/merge-pr.sh runs client-side
          # — one implementation, two callers, so the server-side backstop
          # cannot drift from the local gate.
          #
          # Checking out the default branch means the checker is absent on the
          # PR that introduces it. That is not an error: the gate is not in
          # effect on the trusted branch yet.
          # Reported as success with a description that says exactly why, the
          # same convention apply-keywords.sh itself uses for INERT.
          if [[ ! -f scripts/apply-keywords.sh ]]; then
            out="APPLY KEYWORDS INERT — checker not present on the default branch (not in effect yet)"
            rc=0
          else
            out=$(bash scripts/apply-keywords.sh "$PR_NUMBER" 2>&1)
            rc=$?
          fi
          echo "$out"

          after=$(gh pr view "$PR_NUMBER" --json headRefOid,updatedAt --jq '"\(.headRefOid)|\(.updatedAt)"')
          if [[ "$before" != "$after" ]]; then
            echo "PR changed during the check ($before -> $after) — publishing nothing."
            echo "The event for that change queues its own run (cancel-in-progress is false)."
            exit 0
          fi

          head_sha="${before%%|*}"
          if [[ "$rc" -eq 0 ]]; then state="success"; else state="failure"; fi
          desc=$(head -1 <<<"$out")
          # `set -e` is deliberately NOT on in this step (rc is inspected
          # above), so the publish has to be checked explicitly: without this,
          # a failed gh api call would fall through to a green step that
          # published no status at all.
          if ! gh api "repos/${GITHUB_REPOSITORY}/statuses/$head_sha" \
            -f state="$state" \
            -f context="ralph-apply-keywords" \
            -f description="${desc:0:130}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null; then
            echo "::error::failed to publish the ralph-apply-keywords status on $head_sha"
            exit 1
          fi
          echo "commit status published: ralph-apply-keywords=$state"
