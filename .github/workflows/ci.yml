name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  board-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install workspace dev deps
        run: npm ci
      - name: Typecheck board.ts
        run: npx tsc --noEmit
      - name: board.ts test suite
        # Directory, not filename: a new *.test.ts beside board.ts (e.g. the
        # metrics registry) must not be silently skipped by CI.
        run: npx vitest run ralph/scripts/
      - name: Contract schema drift check
        # Re-emit the ralph/contracts/generated artifacts to a temp dir and
        # diff — contracts.ts and the committed schemas cannot drift apart.
        run: npm run contracts:check

      - name: BDD replay suite (cucumber-js)
        # plugin/ralph-herdr/features — the replay profile only: cucumber
        # steps drive the real bash scripts (spawn path, watch-event.sh,
        # reconcile.sh, ralph-answer.sh, work-fleet.sh) through the
        # tests/fake-herdr.sh + fake-board.sh shims, same harness as the
        # *.test.sh suites in the test-hooks job. @live scenarios need a
        # real herdr server and NEVER run in CI — scripts/nightly-live.sh
        # runs them from local launchd (see its header for the wiring).
        run: npm run test:bdd

  build-and-test-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/ralph-demo/remotion
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: plugin/ralph-demo/remotion/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The scaffold owns no logic to unit-test (GH-1750). What can rot is the
      # composition registry and the types — typing drift already went unnoticed
      # once while 51/51 vitest cases stayed green.
      - name: Compositions smoke
        run: npx remotion compositions src/index.ts

      - name: Typecheck
        run: npx tsc --noEmit

      # Builds a real VP8 WebM from PNG frames and measures it, so this also
      # proves the vendored Remotion ffmpeg/ffprobe are present (GH-2017).
      - name: measure-clip
        run: pnpm test:measure

  build-and-test-knowledge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/ralph-knowledge
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugin/ralph-knowledge/package-lock.json

      - name: Cache HuggingFace models (GH-920)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-${{ hashFiles('plugin/ralph-knowledge/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Heap regression bench (GH-913)
        run: npm run bench:heap -- --assert
        timeout-minutes: 5

      - name: Retrieval eval (GH-920)
        run: npm run eval:retrieval -- --assert
        timeout-minutes: 10

  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # fleet.test.sh's brief cases run the REAL board CLI. Without deps the
      # board shim falls back to `npx tsx@4.19.0` (a network fetch per run) and
      # `contract validate` refuses for want of zod, so the suite would exercise
      # only the degraded branch — on a network hiccup it would fail outright.
      # Installing deps makes CI run the strict branch; the suite's capability
      # gate stays for hosts that legitimately have no zod.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run hook tests
        shell: bash
        run: |
          # Glob both naming conventions used today (*.test.sh and test-*.sh).
          # Each file runs in its own subshell so a `set -e` exit in one test
          # cannot abort the suite. First non-zero rc propagates.
          # (ralph/hooks/scripts/__tests__ deleted in the v2 cutover, GH-1662 —
          # funnel-merge.sh, funnel-board.sh, and tick.sh each have a dedicated
          # suite here: funnel-merge.test.sh, funnel-board.test.sh, tick.test.sh.
          # plugin/ralph-herdr/tests carries the bash half of the grammar-B
          # naming mirror — naming.test.sh, also `npm run test:naming` — plus
          # the Phase-2 watcher suite watcher.test.sh (`npm run test:watcher`),
          # the Phase-3 fleet suite fleet.test.sh (`npm run test:fleet`;
          # its brief-validation cases run the real board CLI offline, so the
          # runner needs a node/npx — ubuntu-latest ships one), the
          # Phase-4 card-substrate suite substrate.test.sh
          # (`npm run test:substrate`), and the Phase-5 cockpit suite
          # cockpit.test.sh (`npm run test:cockpit`; launcher ladder +
          # cockpit-fzf.sh's sourced pure functions — it never drives a real
          # fzf, so the runner needs none). The fake-herdr.sh and
          # fake-board.sh PATH shims are helpers, not *.test.sh, so the glob
          # deliberately skips them.)
          find scripts/__tests__ plugin/ralph-herdr/tests \
            \( -name '*.test.sh' -o -name 'test-*.sh' \) \
            -type f -print0 \
            | sort -z \
            | xargs -0 -n1 bash -c 'echo "=== $0 ==="; bash "$0"; rc=$?; if [ $rc -ne 0 ]; then echo "FAIL: $0 exited $rc"; exit $rc; fi'

      # The cockpit Go TUI (plugin/ralph-herdr/cockpit) — gofmt, vet, and the
      # table-driven update-loop tests. Gated the same way the host-key
      # freshness step gates on the network: a runtime probe that degrades to
      # "not evaluated" instead of failing, because a runner without a Go
      # toolchain says nothing about the code (ubuntu-latest ships one, so in
      # practice this runs; the probe keeps the job honest on leaner runners
      # and local act/self-hosted setups). No setup-go: the ladder's rung-1
      # binary is built locally by scripts/build-cockpit.sh, never in CI.
      - name: Cockpit Go suite (only when a Go toolchain is present)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1; then
            echo "::notice::Cockpit Go suite not evaluated — no Go toolchain on this runner (build-cockpit.sh documents the local run)."
            exit 0
          fi
          cd plugin/ralph-herdr/cockpit
          go version
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required on:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...

  # Defense-in-depth guard against the failure mode from GH-#####:
  # `.mcp.json` referencing an npm version that was never published, leaving
  # every Claude Code session in a broken state (`npx ETARGET`). The release
  # workflows are the primary defense (publish-first ordering); this job is
  # the second line that catches manual edits, dependency-bot drift, or any
  # release-workflow regression that pushes a bad pin to main.
  verify-mcp-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify every .mcp.json pin resolves on npm
        shell: bash
        run: |
          set -euo pipefail

          # Locate every committed .mcp.json (skip nested copies under node_modules,
          # build output, the local worktrees stash, and the .git tree itself).
          # Read into an array with a portable while-read loop instead of mapfile,
          # so the script also runs on bash < 4 for local verification.
          MCP_FILES=()
          while IFS= read -r -d '' f; do
            MCP_FILES+=("$f")
          done < <(
            find . \
              -name '.mcp.json' \
              -not -path '*/node_modules/*' \
              -not -path '*/.claude/worktrees/*' \
              -not -path '*/dist/*' \
              -not -path '*/.git/*' \
              -print0
          )

          if [ "${#MCP_FILES[@]}" -eq 0 ]; then
            echo "No .mcp.json files found; nothing to verify."
            exit 0
          fi

          FAILED=0
          for f in "${MCP_FILES[@]}"; do
            echo "::group::Scanning $f"
            # Pull every args entry that looks like a pkg@version spec.
            # Matches both unscoped (foo@1.2.3) and scoped (@scope/foo@1.2.3)
            # because npm view accepts both formats verbatim.
            PINS=$(jq -r '
              (.mcpServers // {})
              | to_entries[]
              | .value.args // []
              | .[]
              | select(test("@[0-9]+\\.[0-9]+\\.[0-9]+"))
            ' "$f" 2>/dev/null || true)

            if [ -z "$PINS" ]; then
              echo "  (no pkg@version pins found)"
              echo "::endgroup::"
              continue
            fi

            while IFS= read -r pin; do
              [ -z "$pin" ] && continue
              if npm view "$pin" version --json >/dev/null 2>&1; then
                echo "  ✓ $pin"
              else
                echo "::error file=$f::pinned spec '$pin' is not published on npm — Claude Code sessions will fail to start this MCP server"
                FAILED=1
              fi
            done <<< "$PINS"
            echo "::endgroup::"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more .mcp.json files reference unpublished npm versions. See annotations above."
            exit 1
          fi
          echo "All .mcp.json pins resolve on the npm registry."

  # GH-1976. The herdr half of the cockpit has no `plugin update`, so the
  # version in plugin/ralph-herdr/herdr-plugin.toml is the ONLY thing that
  # tells an installed cockpit to reinstall — and GH-1808 changed the spawn
  # path without moving it. The existing check compares the two stamps to each
  # other, which says nothing about whether either tracks the code.
  #
  # pull_request only: on a push to main the range is the merge itself, which
  # has already been judged here. fetch-depth 0 because the guard needs the
  # base commit, and it errors (never passes) when it cannot resolve one.
  herdr-version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Guard the ralph-herdr version stamp
        run: bash scripts/check-herdr-version-bump.sh "${{ github.event.pull_request.base.sha }}" HEAD

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GH-1770. `ssh-keyscan` trusts whatever key answers, so it
      # authenticates nothing; in the release workflows it guarded the push
      # carrying RELEASE_DEPLOY_KEY, the sole ruleset-bypass actor on
      # protected main. Fixed twice already — PR #1740 (release-knowledge.yml)
      # and PR #1767 (release-ralph.yml, which missed the first port) — so the
      # convention clearly does not survive review on its own.
      #
      # The rule is about executable lines, not mentions: both release
      # workflows explain the hazard in prose beside the pinned key, and the
      # check excludes comment lines so that rationale can stay. Logic lives
      # in scripts/ because a guard whose own source is in scope matches
      # itself; these comments are free to name it.
      - name: Guard host-key pinning in release workflows
        run: bash scripts/check-host-key-pinning.sh

      # Advisory by construction, in the same spirit as doctor's state smells:
      # this step never gates a PR. GitHub rotating its Ed25519 host key is
      # rare but would break the release push with a host-key mismatch, so
      # drift is worth surfacing early. It is warn-only because the assertion
      # needs the network, and api.github.com being unreachable is not
      # evidence about our key — an unrelated outage must not redden PRs. A
      # failed fetch therefore degrades to "not evaluated" rather than a
      # verdict.
      #
      # The key is read back out of the workflows rather than restated here;
      # a third copy of the pinned material would be one more thing to drift.
      - name: Check pinned host key is still published by GitHub (warn-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          # `|| true`: grep exits 1 on no match, and GitHub runs this block as
          # `bash -e {0}` — the `set -uo pipefail` above does not clear that
          # `-e` (GH-1827), so an unmatched grep would abort here instead of
          # reaching the "nothing to compare" notice below.
          pinned="$(grep -rhoE 'AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/=]+' \
            .github/workflows/ | sort -u || true)"
          if [ -z "$pinned" ]; then
            echo "::notice::No pinned Ed25519 host key found under .github/workflows/ — nothing to compare."
            exit 0
          fi
          if ! meta="$(curl -sSf --max-time 15 https://api.github.com/meta)"; then
            echo "::notice::Host-key freshness not evaluated — api.github.com unreachable."
            exit 0
          fi
          published="$(printf '%s' "$meta" | jq -r '.ssh_keys[]')"
          rc=0
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            if printf '%s\n' "$published" | grep -qxF "ssh-ed25519 ${key}"; then
              echo "OK — pinned key ...${key: -12} is still published by GitHub"
            else
              echo "::warning::Pinned Ed25519 host key ...${key: -12} is not in the .ssh_keys array of https://api.github.com/meta. If GitHub rotated it, the release push will fail host-key verification until the release workflows are updated."
              rc=1
            fi
          done <<< "$pinned"
          exit "$rc"

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # shellcheck disabled: many existing scripts use single-quoted jq
          # filters (intentional). Re-enable after a follow-up cleanup pass.
          # The routing_pat ignore is a false positive — actionlint infers the
          # secrets schema from the first dash-spelled usage and then flags the
          # uppercase fallback. Both spellings are valid GitHub secret names.
          /tmp/actionlint \
            -color \
            -shellcheck= \
            -ignore 'property "routing_pat" is not defined'

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Run zizmor
        env:
          ZIZMOR_VERSION: 1.24.1
        run: |
          set -euo pipefail
          # Inline zizmor config. unpinned-uses is fully addressed by
          # GH-1033 (S6); artipacked findings are low-confidence and tracked
          # for follow-up. We disable both here so this job is green on its
          # introducing PR. Remove these once S6 lands and the artipacked
          # cleanup is done.
          {
            echo 'rules:'
            echo '  unpinned-uses:'
            echo '    disable: true'
            echo '  artipacked:'
            echo '    disable: true'
          } > /tmp/zizmor.yml
          uvx --from "zizmor==${ZIZMOR_VERSION}" zizmor \
            --config /tmp/zizmor.yml \
            .github/workflows/

  shellcheck-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ludeeus/action-shellcheck v2.0.0 (pinned to commit SHA)
      - name: Run ShellCheck on bash hooks
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: ralph/hooks
          severity: error
          format: gcc

      # GH-1589: repo-root scripts/ carries the portable merge gate — lint it too.
      - name: Run ShellCheck on repo scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: scripts
          severity: error
          format: gcc

      # ralph-herdr cockpit: naming.sh/lib.sh derive agent names at spawn —
      # the bash half of the grammar-B mirror deserves the same lint bar.
      - name: Run ShellCheck on ralph-herdr plugin scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: plugin/ralph-herdr
          severity: error
          format: gcc
