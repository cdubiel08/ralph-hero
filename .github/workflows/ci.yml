name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test-hero:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/ralph-hero/mcp-server
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugin/ralph-hero/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-and-test-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/ralph-demo/remotion
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: plugin/ralph-demo/remotion/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  build-and-test-knowledge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/ralph-knowledge
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugin/ralph-knowledge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Heap regression bench (GH-913)
        run: npm run bench:heap -- --assert
        timeout-minutes: 5

  test-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for doctor tests)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run CLI tests
        uses: bats-core/bats-action@2.0.0
        with:
          support-path: plugin/ralph-hero/scripts/__tests__
          tests-path: plugin/ralph-hero/scripts/__tests__

  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # shellcheck disabled: many existing scripts use single-quoted jq
          # filters (intentional). Re-enable after a follow-up cleanup pass.
          # The routing_pat ignore is a false positive — actionlint infers the
          # secrets schema from the first dash-spelled usage and then flags the
          # uppercase fallback. Both spellings are valid GitHub secret names.
          /tmp/actionlint \
            -color \
            -shellcheck= \
            -ignore 'property "routing_pat" is not defined'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run zizmor
        env:
          ZIZMOR_VERSION: 1.24.1
        run: |
          set -euo pipefail
          # Inline zizmor config. unpinned-uses is fully addressed by
          # GH-1033 (S6); artipacked findings are low-confidence and tracked
          # for follow-up. We disable both here so this job is green on its
          # introducing PR. Remove these once S6 lands and the artipacked
          # cleanup is done.
          {
            echo 'rules:'
            echo '  unpinned-uses:'
            echo '    disable: true'
            echo '  artipacked:'
            echo '    disable: true'
          } > /tmp/zizmor.yml
          uvx --from "zizmor==${ZIZMOR_VERSION}" zizmor \
            --config /tmp/zizmor.yml \
            .github/workflows/
