# doctor.yml — the watcher-of-the-watcher (GH-1662 Phase 3).
#
# state-guard.yml is the corrective wall, but this repo has observed silent
# Actions non-fire and an expired automation PAT — so a weekly sweep runs
# `board doctor` from CI and fails LOUDLY if the board holds drift or the
# guard's own runs are not green. Read-only (no --fix): corrections stay
# with the reconciler lane; this job only makes silence impossible.
#
# Portable (GH-2088): this file ships in the plugin's gate kit too. Same
# resolve step as state-guard.yml — in-tree board CLI when present (the
# canonical ralph repo), else a clone of the kit's source repo at the release
# tag the kit stamp (.github/ralph-kit.json) pins, run against this repo's
# own board config. No board configured -> idle, not red.

name: doctor

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  RALPH_KIT_SOURCE: cdubiel08/ralph-hero

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the board CLI (in-tree, else the kit's pinned tag)
        env:
          ROUTING_PAT: ${{ secrets.ROUTING_PAT }}
        run: |
          # No board configured -> nothing to sweep: idle, deliberately not red.
          if { [ -f .ralph.json ] && jq -e '.projectNumber' .ralph.json >/dev/null 2>&1; } \
             || { [ -f .claude/settings.json ] && jq -e '.env.RALPH_GH_PROJECT_NUMBER' .claude/settings.json >/dev/null 2>&1; }; then
            :
          else
            echo "no board config (.ralph.json projectNumber, or .claude/settings.json env RALPH_GH_PROJECT_NUMBER) — nothing to sweep; exiting idle"
            echo "BOARD_IDLE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # A configured board with no PAT is a silent watcher — loud, never silent.
          if [ -z "$ROUTING_PAT" ]; then
            echo "::error::ROUTING_PAT secret is missing or empty — board reads need a classic PAT with project scope (GITHUB_TOKEN cannot read a personal-account Projects V2 board); see install-gates.sh manual steps"
            exit 1
          fi
          if [ -f ralph/scripts/board.ts ]; then
            npm ci
            echo "BOARD_DIR=." >> "$GITHUB_ENV"
          else
            version="$(jq -r '.version // empty' .github/ralph-kit.json 2>/dev/null || true)"
            if [ -z "$version" ] || [ "$version" = "unknown" ]; then
              echo "::error::no board CLI in-tree and no usable kit stamp (.github/ralph-kit.json) — re-run install-gates.sh from the ralph plugin"
              exit 1
            fi
            src="$RUNNER_TEMP/ralph-src"
            git clone --quiet --depth 1 --branch "ralph-v$version" "https://github.com/$RALPH_KIT_SOURCE" "$src" \
              || { echo "::error::could not fetch $RALPH_KIT_SOURCE at tag ralph-v$version (the kit stamp's pin) — re-run install-gates.sh to refresh the stamp"; exit 1; }
            (cd "$src" && npm ci)
            echo "BOARD_DIR=$src" >> "$GITHUB_ENV"
          fi

      - name: board doctor (read-only, strict on state hygiene)
        if: env.BOARD_IDLE != '1'
        env:
          GH_TOKEN: ${{ secrets.ROUTING_PAT }}
        run: '"$BOARD_DIR/node_modules/.bin/tsx" "$BOARD_DIR/ralph/scripts/board.ts" doctor --strict'
