# state-guard — the server-side corrective wall for the ralph v2 board (GH-1662).
#
# Two lanes (design §3, thoughts/shared/ideas/2026-07-31-ralph-v2-minimal-harness.md):
#   event lane      — issue events: adopt new issues to Backlog, reconcile
#                     closed/reopened reality onto the board field (a merged
#                     PR's `Closes #NNN` auto-close arrives here as
#                     `issues: closed`), run the parent gate.
#   reconciler lane — cron sweep for field-level drift no event reports
#                     (Projects V2 emits no usable Actions trigger).
#
# Portable (GH-2088): this file ships in the plugin's gate kit too. The resolve
# step uses the in-tree board CLI when present (the canonical ralph repo);
# a host repo that installed the kit has no ralph/scripts/board.ts, so it
# clones the canonical repo at the release tag the kit stamp
# (.github/ralph-kit.json) pins and runs THAT copy against this repo's own
# board config (.ralph.json / .claude/settings.json env). Supply-chain
# surface, stated: the fetch executes code from the kit's source repo at a tag
# chosen by the installed kit version — the same trust the vendored gate
# scripts already extend, bounded by the pin. A repo with no board configured
# exits idle: nothing to guard is not red.
#
# Board writes need ROUTING_PAT (classic PAT with project scope) — GITHUB_TOKEN
# cannot write a personal-account Projects V2 board. Every correction posts an
# issue comment; enforcement is visible. `board doctor` checks this workflow's
# run conclusions, so a rotten PAT is loud, not silent.

name: state-guard

on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# One concurrency key per issue (or the sweep). A merged PR needs no lane of
# its own: `Closes #NNN` auto-close emits `issues: closed`, which reconciles —
# a PR-keyed lane would race the issue-keyed one on the same item.
concurrency:
  group: state-guard-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

env:
  RALPH_KIT_SOURCE: cdubiel08/ralph-hero

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the board CLI (in-tree, else the kit's pinned tag)
        env:
          ROUTING_PAT: ${{ secrets.ROUTING_PAT }}
        run: |
          # No board configured -> nothing to guard: idle, deliberately not red.
          if { [ -f .ralph.json ] && jq -e '.projectNumber' .ralph.json >/dev/null 2>&1; } \
             || { [ -f .claude/settings.json ] && jq -e '.env.RALPH_GH_PROJECT_NUMBER' .claude/settings.json >/dev/null 2>&1; }; then
            :
          else
            echo "no board config (.ralph.json projectNumber, or .claude/settings.json env RALPH_GH_PROJECT_NUMBER) — nothing to guard; exiting idle"
            echo "BOARD_IDLE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # A configured board with no PAT is a broken wall — loud, never silent.
          if [ -z "$ROUTING_PAT" ]; then
            echo "::error::ROUTING_PAT secret is missing or empty — board writes need a classic PAT with project scope (GITHUB_TOKEN cannot write a personal-account Projects V2 board); see install-gates.sh manual steps"
            exit 1
          fi
          if [ -f ralph/scripts/board.ts ]; then
            npm ci
            echo "BOARD_DIR=." >> "$GITHUB_ENV"
          else
            version="$(jq -r '.version // empty' .github/ralph-kit.json 2>/dev/null || true)"
            if [ -z "$version" ] || [ "$version" = "unknown" ]; then
              echo "::error::no board CLI in-tree and no usable kit stamp (.github/ralph-kit.json) — re-run install-gates.sh from the ralph plugin"
              exit 1
            fi
            src="$RUNNER_TEMP/ralph-src"
            git clone --quiet --depth 1 --branch "ralph-v$version" "https://github.com/$RALPH_KIT_SOURCE" "$src" \
              || { echo "::error::could not fetch $RALPH_KIT_SOURCE at tag ralph-v$version (the kit stamp's pin) — re-run install-gates.sh to refresh the stamp"; exit 1; }
            (cd "$src" && npm ci)
            echo "BOARD_DIR=$src" >> "$GITHUB_ENV"
          fi

      - name: Event lane — adopt / reconcile / parent gate
        if: env.BOARD_IDLE != '1' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.ROUTING_PAT }}
          RALPH_CLAIM_HOLDER: state-guard
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          board() { "$BOARD_DIR/node_modules/.bin/tsx" "$BOARD_DIR/ralph/scripts/board.ts" "$@"; }
          case "$ACTION" in
            opened)          board adopt "$ISSUE" ;;
            closed|reopened) board reconcile "$ISSUE" ;;
          esac

      - name: Reconciler lane — field-drift sweep
        if: env.BOARD_IDLE != '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.ROUTING_PAT }}
          RALPH_CLAIM_HOLDER: state-guard
        run: '"$BOARD_DIR/node_modules/.bin/tsx" "$BOARD_DIR/ralph/scripts/board.ts" doctor --fix'
